spring.application.name=local-arcade
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.address=0.0.0.0
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/local_arcade?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
quiz.wiki-root=${QUIZ_WIKI_ROOT:../LlmWiki_Backup/wiki}
